[project]
name = "lending-decision-platform"
version = "0.1.0"
description = "Mortgage decisioning on national HMDA data: PySpark and Delta pipeline, TensorFlow model with a fair-lending audit and reason codes, TF Serving, Pub/Sub to BigQuery monitoring, Terraform for GCP and a Databricks bundle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
# The base install is what the API, the Pub/Sub sink and the monitor need. It has no TensorFlow and no Spark:
# the API talks to TF Serving over HTTP, so its image stays small.
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "httpx>=0.28",
  "structlog>=25.4",
  "prometheus-client>=0.23",
  "typer>=0.20",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "pyarrow>=21",
  "google-cloud-pubsub>=2.43",
  "google-cloud-bigquery>=3.46",
]

[project.optional-dependencies]
spark = [
  "pyspark==4.2.0",
  "delta-spark==4.4.1",
  "pyarrow>=21",
  "pandas>=2.3,<3",
]
train = [
  "tensorflow-cpu==2.21.0",
  "scikit-learn>=1.7",
  "xgboost>=3.1",
  "pandas>=2.3,<3",
  "pyarrow>=21",
  "matplotlib>=3.10",
]
dev = [
  "pytest>=8.4",
  "pytest-cov>=7",
  "ruff>=0.14",
  "mypy>=1.18",
  "pandas-stubs>=2.3",
  "respx>=0.22",
  "testcontainers>=4.13",
  "pip-audit>=2.9",
  "check-jsonschema>=0.34",
  "pyyaml>=6",
  "types-pyyaml>=6",
]

[project.scripts]
ldp = "ldp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ldp"]

[tool.uv]
# tensorflow-cpu has no macOS wheel; the project targets Linux (CI, containers, Databricks) and Windows.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W", "PL", "RUF", "SIM", "C4", "PT"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S101", "S311", "S603", "S607", "E501", "PLR0912", "PLR0915", "RUF012", "PLC0415", "PLR0914", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["ldp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B011", "PT018"]
"scripts/**" = ["T201", "S"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "spark: needs Java 17+ and the spark extra",
  "tf: needs the train extra",
  "integration: needs Docker (Testcontainers)",
]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/ldp"]
omit = ["src/ldp/cli.py"]
