global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: tfserving
    metrics_path: /monitoring/prometheus/metrics
    static_configs: [{ targets: ["tfserving:8501"] }]
  - job_name: sink
    static_configs: [{ targets: ["sink:9109"] }]
  - job_name: monitor
    static_configs: [{ targets: ["monitor:9108"] }]
