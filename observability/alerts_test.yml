# promtool test rules alerts_test.yml
rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  - name: error rate above 2% fires after 5 minutes
    interval: 1m
    input_series:
      - series: 'ldp_http_requests_total{route="/v1/decisions", status="200"}'
        values: "0+100x15"
      - series: 'ldp_http_requests_total{route="/v1/decisions", status="503"}'
        values: "0+5x15"
    alert_rule_test:
      - eval_time: 3m
        alertname: LdpHighErrorRate
        exp_alerts: []
      - eval_time: 12m
        alertname: LdpHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "More than 2% of decision requests fail with 5xx"
              runbook: "docs/RUNBOOK.md#high-error-rate"

  - name: healthy traffic raises nothing
    interval: 1m
    input_series:
      - series: 'ldp_http_requests_total{route="/v1/decisions", status="200"}'
        values: "0+100x15"
      - series: 'ldp_http_requests_total{route="/v1/decisions", status="503"}'
        values: "0+1x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: LdpHighErrorRate
        exp_alerts: []

  - name: latency SLO breach
    interval: 1m
    input_series:
      - series: 'ldp_http_request_seconds_bucket{route="/v1/decisions", le="0.1"}'
        values: "0+10x30"
      - series: 'ldp_http_request_seconds_bucket{route="/v1/decisions", le="0.25"}'
        values: "0+10x30"
      - series: 'ldp_http_request_seconds_bucket{route="/v1/decisions", le="0.5"}'
        values: "0+100x30"
      - series: 'ldp_http_request_seconds_bucket{route="/v1/decisions", le="+Inf"}'
        values: "0+100x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: LdpLatencySloBreach
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Decision p99 latency above the 250 ms SLO"
              runbook: "docs/RUNBOOK.md#latency"

  - name: major input drift on one feature
    interval: 1m
    input_series:
      - series: 'ldp_feature_psi{feature="loan_amount"}'
        values: "0.31x30"
      - series: 'ldp_feature_psi{feature="income"}'
        values: "0.04x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: LdpFeatureDriftMajor
        exp_alerts:
          - exp_labels: { severity: warning, feature: loan_amount }
            exp_annotations:
              summary: "Input loan_amount has shifted from the training year (PSI > 0.25)"
              runbook: "docs/RUNBOOK.md#drift"

  - name: adverse impact below four-fifths for 30 minutes
    interval: 5m
    input_series:
      - series: 'ldp_model_air{dimension="race", group="Black or African American"}'
        values: "0.72x12"
      - series: 'ldp_model_air{dimension="sex", group="Female"}'
        values: "0.97x12"
    alert_rule_test:
      - eval_time: 20m
        alertname: LdpAdverseImpact
        exp_alerts: []
      - eval_time: 40m
        alertname: LdpAdverseImpact
        exp_alerts:
          - exp_labels: { severity: critical, team: compliance, dimension: race, group: "Black or African American" }
            exp_annotations:
              summary: "Adverse impact ratio for race=Black or African American is below 0.80"
              runbook: "docs/RUNBOOK.md#adverse-impact"

  - name: stale monitor
    interval: 1m
    input_series:
      - series: "ldp_monitor_last_success_timestamp"
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: LdpMonitorStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "The drift and fairness monitor has not completed a cycle in 15 minutes"
              runbook: "docs/RUNBOOK.md#monitor"
